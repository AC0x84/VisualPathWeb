<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Path - Sign Up</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header Section -->
    <header>
        <h1>Visual Path</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="how-it-works.html">How It Works</a>
            <a href="textbooks.html">Textbooks</a>
            <a href="contact.html">Contact Us</a>
        </nav>
        <div class="auth-buttons">
            <a href="signup.html" class="auth-button"> Sign Up</a>
            <a href="signin.html" class="auth-button"> Sign In</a>
        </div>
        <button id="theme-toggle">🌞</button>
    </header>

    <!-- Sign Up Section -->
    <section class="auth-section">
        <h2 class="animated-text">Create Your Account</h2>
        <form class="auth-form" id="signup-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
                <p id="password-error" class="error-message" style="display: none; color: red; font-size: 0.9em;">Passwords do not match!</p>
            </div>
            <button type="submit" class="auth-submit-button">Sign Up</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="signin.html">Sign In</a></p>
    </section>

    <!-- Footer Section -->
    <footer>
        <p>ALWAYS SEEK TO GAIN NEW KNOWLEDGE. WANTS TO ASSIST OUR COUNTRY. Future Software Engineers…….</p>
    </footer>

    <!-- Link to JavaScript -->
    <script src="script.js"></script>
    <script>
        // Handle Sign Up Form Submission
        document.getElementById('signup-form').addEventListener('submit', function (event) {
            event.preventDefault(); // Prevent the form from submitting the traditional way

            // Get form values
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const passwordError = document.getElementById('password-error');

            // Check if passwords match
            if (password !== confirmPassword) {
                passwordError.style.display = 'block'; // Show error message
                return; // Stop the function if passwords don't match
            } else {
                passwordError.style.display = 'none'; // Hide error message if passwords match
            }

            // Store the account in local storage
            const account = { name, email, password };
            localStorage.setItem('account', JSON.stringify(account));

            // Simulate a successful sign-up process
            alert('Sign Up Successful! Redirecting to Sign In page...');

            // Redirect to Sign In page immediately
            window.location.href = 'signin.html';
        });
    </script>
</body>
</html>
